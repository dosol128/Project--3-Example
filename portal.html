<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Project Preview Hub</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }

        .portal-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .portal-header h1 {
            margin: 0 0 8px 0;
            color: #38bdf8;
        }

        .portal-header p {
            margin: 0;
            color: #94a3b8;
        }

        /* Nav Tabs linking to the main iframe */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: #1e293b;
            color: #f8fafc;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }

        /* Section 1: Interactive Full-Size Viewer */
        .viewer-container {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            margin-bottom: 50px;
        }

        .viewer-title {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main-frame {
            width: 100%;
            height: 650px;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #ffffff;
        }

        /* Section 2: All 3 Options Side-by-Side Grid */
        .section-divider {
            text-align: center;
            margin: 40px 0 20px 0;
            border-top: 1px solid #334155;
            padding-top: 30px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
        }

        .grid-card {
            background-color: #1e293b;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #334155;
        }

        .grid-card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #38bdf8;
            text-align: center;
        }

        .mini-frame {
            width: 100%;
            height: 500px;
            border: 1px solid #475569;
            border-radius: 6px;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="portal-header">
        <h1>Student Web Development Project Hub</h1>
        <p>Interactive Spec-Match Preview Portal</p>
    </header>

    <!-- Interactive Navigation Tabs -->
    <nav class="nav-tabs">
        <a href="option-a.html" target="project-viewport" class="tab-btn">Option A: VIP Tech</a>
        <a href="option-b.html" target="project-viewport" class="tab-btn">Option B: K-Pop Fan Pass</a>
        <a href="option-c.html" target="project-viewport" class="tab-btn">Option C: Summer Camp</a>
    </nav>

    <!-- Single Full Viewport (Changes when clicking tabs) -->
    <section class="viewer-container">
        <div class="viewer-title">Active Preview Screen</div>
        <iframe name="project-viewport" src="option-a.html" class="main-frame" title="Project Preview"></iframe>
    </section>

    <!-- Grid View: All 3 Projects Side-by-Side -->
    <div class="section-divider">
        <h2>Side-by-Side Comparison Grid</h2>
    </div>

    <section class="grid-layout">
        <!-- Frame 1 -->
        <div class="grid-card">
            <h3>Option A: VIP Tech Conference</h3>
            <iframe src="option-a.html" class="mini-frame" title="Option A Preview"></iframe>
        </div>

        <!-- Frame 2 -->
        <div class="grid-card">
            <h3>Option B: K-Pop VIP Fan Pass</h3>
            <iframe src="option-b.html" class="mini-frame" title="Option B Preview"></iframe>
        </div>

        <!-- Frame 3 -->
        <div class="grid-card">
            <h3>Option C: Summer Camp Pass</h3>
            <iframe src="option-c.html" class="mini-frame" title="Option C Preview"></iframe>
        </div>
    </section>

</body>
</html>
